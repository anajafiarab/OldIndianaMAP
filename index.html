<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Old Indiana Map</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Tahoma, Geneva, sans-serif;
    }
    body {
      background: #d4d0c8;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('old-map.png') center center / contain no-repeat;
      opacity: 0.35;
      z-index: 0;
    }
    .coming {
      position: relative;
      z-index: 1;
      text-align: center;
      background: rgba(255,255,255,0.94);
      border: 1px solid #808080;
      padding: 28px 36px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
      max-width: 90%;
    }
    .coming h1 {
      margin: 0 0 8px 0;
      font-size: 22px;
      color: #4a6b4a;
    }
    .coming p {
      margin: 0;
      font-size: 14px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="coming">
  <h1>Coming Soon</h1>
  <p>The classic IndianaMAP is returning.</p>
  <p style="margin-top: 10px; font-size: 13px;">Independent project to rebuild an accessible and dependable public-data viewer.</p>
  <p style="margin-top: 8px; font-size: 11px; color: #666;">No affiliation with the IGWS or IGIO.</p>
  <p style="margin-top: 18px;">
    <a href="map.html" style="color: #3d5c3d; font-weight: bold; text-decoration: none; border-bottom: 1px solid #3d5c3d;">
      Open the Map Viewer →
    </a>
  </p>
</div>
