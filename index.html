<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Old Indiana Map</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tahoma, Geneva, sans-serif;
      height: 100vh;
      background: #d4d0c8 url('old-map.png') center center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .coming {
      text-align: center;
      background: rgba(255,255,255,0.94);
      border: 1px solid #808080;
      padding: 28px 36px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
    }
    .coming h1 {
      margin: 0 0 8px 0;
      font-size: 22px;
      color: #4a6b4a;
    }
    .coming p {
      margin: 0;
      font-size: 14px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="coming">
    <h1>Coming Soon</h1>
    <p>The classic Indiana map is returning.</p>
  </div>
</body>
</html>
