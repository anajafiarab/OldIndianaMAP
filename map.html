<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Old Indiana Map</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Tahoma, Geneva, sans-serif;
      background: #d4d0c8;
      color: #000;
      font-size: 14px;
    }
    .banner {
      background: #3d5c3d url('banner1.png') center / cover no-repeat;
      padding: 6px 12px;
      border-bottom: 2px solid #2a402a;
      min-height: 52px;
      display: flex;
      align-items: center;
    }
    .banner img { height: 40px; width: auto; }
    .tabs {
      background: #d4d0c8;
      border-bottom: 1px solid #808080;
      padding: 2px 6px 0 6px;
      display: flex;
      gap: 2px;
    }
    .tab {
      background: #d4d0c8;
      border: 1px solid #808080;
      border-bottom: none;
      padding: 6px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    .tab.active {
      background: #fff;
      font-weight: bold;
      position: relative;
      top: 1px;
      border-bottom: 1px solid #fff;
    }
    .toolbar {
      background: #ece9d8;
      border-bottom: 1px solid #808080;
      padding: 6px 8px;
      display: flex;
      gap: 6px;
      font-size: 13px;
    }
    .tool {
      background: #f5f4ea;
      border: 1px solid #808080;
      padding: 4px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
    }
    .tool img { height: 16px; width: auto; margin-right: 5px; }
    .tool:hover, .tool.active { background: #fff; }
    .main { display: flex; height: calc(100vh - 130px); }
    .sidebar {
      width: 240px;
      background: #f0f0f0;
      border-right: 1px solid #808080;
      padding: 10px 12px;
      font-size: 14px;
      overflow-y: auto;
    }
    .sidebar h3 { margin: 0 0 10px 0; font-size: 15px; font-weight: bold; }
    #map { flex: 1; }
    .layer-item, .basemap-item {
      margin: 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .basemap-item:hover { background: #e0e0e0; }
    .basemap-item.active { font-weight: bold; }
    .plss-label {
  background: transparent;
  border: none;
  box-shadow: none;
  font-size: 11px;
  font-weight: bold;
  color: #5a3a1a;
  text-shadow: 1px 1px 1px #fff;
}

  </style>
</head>
<body>
  <div class="banner">
    <img src="logo.png" alt="IndianaMAP">
  </div>
  <div class="tabs">
    <div class="tab active">Map Viewer</div>
    <div class="tab">Map Gallery</div>
    <div class="tab">Layer Gallery</div>
  </div>
  <div class="toolbar">
    <div class="tool" id="basemaps-btn">
      <img src="basemaps.icon.png" alt="Basemaps">
      Basemaps
    </div>
    <div class="tool" id="add-content-btn">
      <img src="addContent.png" alt="Add Content">
      Add Content
    </div>
    <div class="tool" id="active-layers-btn">
      <img src="activeLayers.png" alt="Active Layers">
      Active Layers
    </div>
    <div class="tool" id="legend-btn">
      <img src="legend.png" alt="Legend">
      Legend
    </div>
    <div class="tool" id="reset-btn">
      <img src="reset.png" alt="Reset">
      Reset
    </div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar">
      <h3>Active Layers</h3>
      <div id="layer-list">
        <div class="layer-item">
          <input type="checkbox" id="counties" checked>
          <label for="counties">Indiana Counties</label>
        </div>
      </div>
    </div>
    <div id="map"></div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const wideBounds = L.latLngBounds([25, -100], [50, -70]);
  const map = L.map('map', {
    maxBounds: wideBounds,
    maxBoundsViscosity: 0.3,
    minZoom: 5
  }).setView([39.8, -86.2], 7);

  const basemaps = {
    streets: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
    }),
    imagery: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri', maxZoom: 19
    }),
    hybrid: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri', maxZoom: 19
    }),
    topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap', maxZoom: 17
    })
  };
  const hybridLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri', maxZoom: 19
  });

  const savedBasemap = localStorage.getItem('basemap') || 'streets';
  let currentBasemap = basemaps[savedBasemap] || basemaps.streets;
  currentBasemap.addTo(map);
  if (savedBasemap === 'hybrid') hybridLabels.addTo(map);

  // Layer definitions
  const layerDefs = {
    counties: { name: 'Indiana Counties', group: 'Boundaries', layer: null, opacity: 1 },
    plss: { name: 'PLSS Townships', group: 'Boundaries', layer: null, opacity: 1 }
  };

  // Load Counties
  fetch('https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json')
    .then(r => r.json())
    .then(data => {
      const indiana = {
        type: 'FeatureCollection',
        features: data.features.filter(f => f.properties.STATE === '18' || (f.id && f.id.toString().startsWith('18')))
      };
      layerDefs.counties.layer = L.geoJSON(indiana, {
        style: { color: '#3d5c3d', weight: 1.5, fillOpacity: 0.08 },
        onEachFeature: (f, l) => {}
      });
    });

  // Load PLSS (paged)
  async function loadPLSS() {
    const base = 'https://gisdata.in.gov/server/rest/services/Hosted/PLSS_1/FeatureServer/2/query';
    let all = [], offset = 0, page = 1000, more = true;
    while (more) {
      const url = `${base}?where=1%3D1&outFields=*&f=geojson&resultOffset=${offset}&resultRecordCount=${page}`;
      const data = await (await fetch(url)).json();
      if (data.features && data.features.length) {
        all = all.concat(data.features);
        offset += page;
        if (data.features.length < page) more = false;
      } else more = false;
    }
    layerDefs.plss.layer = L.geoJSON({ type: 'FeatureCollection', features: all }, {
      style: { color: '#8B4513', weight: 1, fillOpacity: 0.04 },
      onEachFeature: (f, l) => {
        const p = f.properties;
        const label = (p.twp && p.rng) ? `T${p.twp}${(p.twpd||'').trim()} R${p.rng}${(p.rngd||'').trim()}` : '';
                l.bindPopup(label || 'Township');
      }
    });
    updatePLSSLabels();
  }
  loadPLSS();

  function updatePLSSLabels() {
    const lyr = layerDefs.plss.layer;
    if (!lyr) return;
    const show = map.getZoom() >= 10;
    lyr.eachLayer(l => l.getTooltip() && (show ? l.openTooltip() : l.closeTooltip()));
  }
  map.on('zoomend', updatePLSSLabels);

  // Active layers state
  let active = JSON.parse(localStorage.getItem('activeLayers') || '[]');

  function saveActive() {
    localStorage.setItem('activeLayers', JSON.stringify(active));
  }

  function renderActive() {
    const list = document.getElementById('active-list');
    if (!list) return;
    list.innerHTML = active.map(id => {
      const def = layerDefs[id];
      if (!def) return '';
      return `
        <div class="layer-item" data-id="${id}">
          <input type="checkbox" ${def.layer && map.hasLayer(def.layer) ? 'checked' : ''}>
          <span style="flex:1">${def.name}</span>
          <input type="range" min="0" max="100" value="${Math.round(def.opacity*100)}" style="width:60px">
          <button class="remove">✕</button>
        </div>`;
    }).join('');

    list.querySelectorAll('.layer-item').forEach(row => {
      const id = row.dataset.id;
      const def = layerDefs[id];
      const cb = row.querySelector('input[type=checkbox]');
      const slider = row.querySelector('input[type=range]');
      const btn = row.querySelector('.remove');

      cb.addEventListener('change', () => {
        if (!def.layer) return;
        cb.checked ? def.layer.addTo(map) : map.removeLayer(def.layer);
        if (def.layer.setStyle) def.layer.setStyle({ fillOpacity: def.opacity * 0.08, opacity: def.opacity });
      });
      slider.addEventListener('input', () => {
        def.opacity = slider.value / 100;
        if (def.layer && def.layer.setStyle) {
          def.layer.setStyle({ fillOpacity: def.opacity * 0.08, opacity: def.opacity });
        }
        saveActive();
      });
      btn.addEventListener('click', () => {
        if (def.layer && map.hasLayer(def.layer)) map.removeLayer(def.layer);
        active = active.filter(x => x !== id);
        saveActive();
        renderActive();
      });
    });
  }
// Identify on click → show in Legend panel
map.on('click', function (e) {
  L.DomEvent.stopPropagation(e);   // prevent layer popups
  const results = [];

  if (layerDefs.counties.layer && map.hasLayer(layerDefs.counties.layer)) {
    layerDefs.counties.layer.eachLayer(l => {
      if (l.getBounds && l.getBounds().contains(e.latlng)) {
        results.push({
          layer: 'Indiana Counties',
          attrs: { Name: l.feature.properties.NAME || '—' }
        });
      }
    });
  }

  if (layerDefs.plss.layer && map.hasLayer(layerDefs.plss.layer)) {
    layerDefs.plss.layer.eachLayer(l => {
      if (l.getBounds && l.getBounds().contains(e.latlng)) {
        const p = l.feature.properties;
        results.push({
          layer: 'PLSS Townships',
          attrs: {
            'Principal Meridian': p.meridian || '—',
            'Township': p.twp || '—',
            'Township Direction': (p.twpd || '').trim() || '—',
            'Range': p.rng || '—',
            'Range Direction': (p.rngd || '').trim() || '—'
          }
        });
      }
    });
  }

  document.getElementById('legend-btn').click();
  const sb = document.getElementById('sidebar');
  if (results.length === 0) {
    sb.innerHTML = `<h3>Legend</h3><p style="color:#666;">No features at this location.</p>`;
    return;
  }
  let html = `<h3>Legend</h3>`;
  results.forEach(r => {
    html += `<div style="margin-bottom:12px;"><strong>${r.layer}</strong><table style="width:100%; font-size:13px; margin-top:4px;">`;
    for (let k in r.attrs) {
      html += `<tr><td style="color:#555; padding:2px 8px 2px 0;">${k}</td><td>${r.attrs[k]}</td></tr>`;
    }
    html += `</table></div>`;
  });
  sb.innerHTML = html;
});

  // Check PLSS
  if (layerDefs.plss.layer && map.hasLayer(layerDefs.plss.layer)) {
    layerDefs.plss.layer.eachLayer(l => {
      if (l.getBounds && l.getBounds().contains(e.latlng)) {
        const p = l.feature.properties;
        results.push({
          layer: 'PLSS Townships',
          attrs: {
            'Principal Meridian': p.meridian || '—',
            'Township': p.twp || '—',
            'Township Direction': (p.twpd || '').trim() || '—',
            'Range': p.rng || '—',
            'Range Direction': (p.rngd || '').trim() || '—'
          }
        });
      }
    });
  }

  // Switch to Legend and render
  document.getElementById('legend-btn').click();
  const sidebar = document.getElementById('sidebar');
  if (results.length === 0) {
    sidebar.innerHTML = `<h3>Legend</h3><p style="color:#666;">No features at this location.</p>`;
    return;
  }

  let html = `<h3>Legend</h3>`;
  results.forEach(r => {
    html += `<div style="margin-bottom:12px;"><strong>${r.layer}</strong><table style="width:100%; font-size:13px; margin-top:4px;">`;
    for (let k in r.attrs) {
      html += `<tr><td style="color:#555; padding:2px 8px 2px 0;">${k}</td><td>${r.attrs[k]}</td></tr>`;
    }
    html += `</table></div>`;
  });
  sidebar.innerHTML = html;
});
  function addLayer(id) {
    if (!active.includes(id)) {
      active.push(id);
      saveActive();
    }
    const def = layerDefs[id];
    if (def.layer && !map.hasLayer(def.layer)) def.layer.addTo(map);
    renderActive();
  }

  // Sidebar switching
  const sidebar = document.getElementById('sidebar');
  const tools = document.querySelectorAll('.tool');
  function setActiveTool(id) {
    tools.forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  document.getElementById('basemaps-btn').addEventListener('click', () => {
    setActiveTool('basemaps-btn');
    sidebar.innerHTML = `
      <h3>Basemaps</h3>
      <div class="basemap-item" data-id="streets">Streets</div>
      <div class="basemap-item" data-id="imagery">Imagery</div>
      <div class="basemap-item" data-id="hybrid">Hybrid</div>
      <div class="basemap-item" data-id="topo">Topographic</div>
    `;
    sidebar.querySelectorAll('.basemap-item').forEach(item => {
      item.addEventListener('click', () => {
        const id = item.dataset.id;
        map.removeLayer(currentBasemap);
        if (map.hasLayer(hybridLabels)) map.removeLayer(hybridLabels);
        currentBasemap = basemaps[id];
        currentBasemap.addTo(map);
        if (id === 'hybrid') hybridLabels.addTo(map);
        localStorage.setItem('basemap', id);
        sidebar.querySelectorAll('.basemap-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
      });
    });
  });

  document.getElementById('add-content-btn').addEventListener('click', () => {
    setActiveTool('add-content-btn');
    sidebar.innerHTML = `
      <h3>Add Content</h3>
      <div style="font-weight:bold; margin:8px 0 4px;">Boundaries</div>
      <div class="basemap-item" data-add="counties">Indiana Counties</div>
      <div class="basemap-item" data-add="plss">PLSS Townships</div>
      <div style="font-weight:bold; margin:12px 0 4px; color:#666;">Geology</div>
      <div style="color:#999; font-size:12px; margin-left:8px;">(coming soon)</div>
      <div style="font-weight:bold; margin:12px 0 4px; color:#666;">Hydrology</div>
      <div style="color:#999; font-size:12px; margin-left:8px;">(coming soon)</div>
    `;
    sidebar.querySelectorAll('[data-add]').forEach(item => {
      item.addEventListener('click', () => addLayer(item.dataset.add));
    });
  });

  document.getElementById('active-layers-btn').addEventListener('click', () => {
    setActiveTool('active-layers-btn');
    sidebar.innerHTML = `<h3>Active Layers</h3><div id="active-list"></div>`;
    renderActive();
  });

  document.getElementById('legend-btn').addEventListener('click', () => {
    setActiveTool('legend-btn');
    sidebar.innerHTML = `<h3>Legend</h3><p style="color:#666;">Click the map to identify features.</p>`;
  });

  document.getElementById('active-layers-btn').click();
</script>
</body>
</html>
