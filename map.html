<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Old Indiana Map</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Tahoma, Geneva, sans-serif;
      background: #d4d0c8;
      color: #000;
      font-size: 14px;
    }
.banner {
  background: #113d43 url('banner1.png') center / cover no-repeat;
  padding: 6px 12px;
  border-bottom: 2px solid #0d2e33;
  min-height: 52px;
  display: flex;
  align-items: center;
}
    .banner img { height: 40px; width: auto; }
.tabs {
  background: #113d43;
  border-bottom: 1px solid #0d2e33;
  padding: 2px 6px 0 6px;
  display: flex;
  gap: 2px;
}
.tab {
  background: #113d43;
  color: #fff;
  border: 1px solid #0d2e33;
  border-bottom: none;
  padding: 6px 16px;
  font-size: 14px;
  cursor: pointer;
}
.tab.active {
  background: #8BA6AA;
  color: #000;
  font-weight: bold;
  position: relative;
  top: 1px;
  border-bottom: 1px solid #8BA6AA;
}
    .tool {
      background: #f5f4ea;
      border: 1px solid #808080;
      padding: 4px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
    }
    .tool img { height: 16px; width: auto; margin-right: 5px; }
    .tool:hover, .tool.active { background: #fff; }
    .main { display: flex; height: calc(100vh - 130px); }
    .sidebar {
      width: 240px;
      background: #f0f0f0;
      border-right: 1px solid #808080;
      padding: 10px 12px;
      font-size: 14px;
      overflow-y: auto;
    }
    .sidebar h3 { margin: 0 0 10px 0; font-size: 15px; font-weight: bold; }
    #map { flex: 1; }
    .layer-item, .basemap-item {
      margin: 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .basemap-item:hover { background: #e0e0e0; }
    .basemap-item.active { font-weight: bold; }
    .plss-label {
  background: transparent;
  border: none;
  box-shadow: none;
  font-size: 11px;
  font-weight: bold;
  color: #5a3a1a;
  text-shadow: 1px 1px 1px #fff;
}
#prev-hit, #next-hit {
  background: #f5f4ea;
  border: 1px solid #808080;
  padding: 2px 10px;
  cursor: pointer;
  font-size: 16px;
}
.layer-item button {
  padding: 0 5px;
  font-size: 11px;
  line-height: 1.2;
  min-width: 18px;
}
.county-label {
  background: transparent;
  border: none;
  box-shadow: none;
  font-size: 12px;
  font-weight: bold;
  color: #2a402a;
  text-shadow: 1px 1px 1px #fff;
}
.banner {
  background: #113d43 url('banner1.png') center / cover no-repeat;
  padding: 6px 12px;
  border-bottom: 2px solid #0d2e33;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.search-box {
  display: flex;
  gap: 4px;
  background: transparent;
  padding: 0;
  border: none;
}
.search-box select,
.search-box input,
.search-box button {
  font-family: Tahoma, Geneva, sans-serif;
  font-size: 13px;
  padding: 3px 6px;
  border: 1px solid #999;
}
.search-box input {
  width: 180px;
}
.search-box button {
  background: #f5f4ea;
  cursor: pointer;
}
.old-marker .pin {
  width: 12px;
  height: 12px;
  background: #c00;
  border: 2px solid #fff;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  box-shadow: 1px 1px 2px rgba(0,0,0,0.4);
}
.tab,
.tool,
.search-box button,
.search-box select,
.search-box input {
  border-radius: 5px;
}
.kmz-label {
  background: transparent;
  border: none;
  box-shadow: none;
  color: #fff;
  font-weight: bold;
  font-size: 11px;
  text-shadow: 
    -1px -1px 0 #000,
     1px -1px 0 #000,
    -1px  1px 0 #000,
     1px  1px 0 #000;
}
.kmz-label::before,
.kmz-label::after {
  display: none !important;
}
  </style>
</head>
<body>
  <div class="banner">
    <img src="logo.png" alt="IndianaMAP">
    <div class="search-box">
      <select id="search-type">
        <option value="address">Address</option>
        <option value="latlon">Lon/Lat</option>
      </select>
      <input id="search-input" type="text" placeholder="100 N. Senate 46204">
      <button id="search-btn">Go</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active">Map Viewer</div>
    <div class="tab">Map Gallery</div>
    <div class="tab">Layer Gallery</div>
  </div>
  <div class="toolbar">
    <div class="tool" id="basemaps-btn">
      <img src="basemaps.icon.png" alt="Basemaps">
      Basemaps
    </div>
    <div class="tool" id="add-content-btn">
      <img src="addContent.png" alt="Add Content">
      Add Content
    </div>
    <div class="tool" id="active-layers-btn">
      <img src="activeLayers.png" alt="Active Layers">
      Active Layers
    </div>
    <div class="tool" id="legend-btn">
      <img src="legend.png" alt="Legend">
      Legend
    </div>
    <div class="tool" id="reset-btn">
      <img src="reset.png" alt="Reset">
      Reset
    </div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar">
      <h3>Active Layers</h3>
      <div id="layer-list">
        <div class="layer-item">
          <input type="checkbox" id="counties" checked>
          <label for="counties">Indiana Counties</label>
        </div>
      </div>
    </div>
    <div id="map"></div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const wideBounds = L.latLngBounds([25, -100], [50, -70]);
  const map = L.map('map', {
    maxBounds: wideBounds,
    maxBoundsViscosity: 0.3,
    minZoom: 5
  }).setView([39.8, -86.2], 7);

  const basemaps = {
    streets: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
    }),
    imagery: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri', maxZoom: 19
    }),
    hybrid: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri', maxZoom: 19
    }),
    topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap', maxZoom: 17
    }),
    usgs: L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'USGS The National Map',
      maxZoom: 16
    })
  };
  const hybridLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri', maxZoom: 19
  });
  const hillshade = L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri, USGS',
    maxZoom: 19,
    opacity: 0.55
  });

  const savedBasemap = localStorage.getItem('basemap') || 'streets';
  let currentBasemap = basemaps[savedBasemap] || basemaps.streets;
  currentBasemap.addTo(map);
  if (savedBasemap === 'hybrid') hybridLabels.addTo(map);

  const layerDefs = {
        hillshade: {
      name: 'Hillshade',
      group: 'Elevation',
      layer: hillshade,
      opacity: 0.55,
      source: { label: 'Esri World Hillshade', url: 'https://services.arcgisonline.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer' }
    },
    counties: {
      name: 'Indiana Counties',
      group: 'Boundaries',
      layer: null,
      opacity: 1,
      source: { label: 'U.S. County Boundaries (public GeoJSON)', url: 'https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json' }
    },
    plss: {
      name: 'PLSS Townships',
      group: 'Boundaries',
      layer: null,
      opacity: 1,
      source: { label: 'Indiana GIO PLSS Townships', url: 'https://gisdata.in.gov/server/rest/services/Hosted/PLSS_1/FeatureServer/2' }
    }
    
  };

  // Counties
  fetch('https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json')
    .then(r => r.json())
    .then(data => {
      const indiana = {
        type: 'FeatureCollection',
        features: data.features.filter(f => f.properties.STATE === '18' || (f.id && f.id.toString().startsWith('18')))
      };
      layerDefs.counties.layer = L.geoJSON(indiana, {
        style: { color: '#3d5c3d', weight: 1.5, fillOpacity: 0.08 },
        onEachFeature: (f, l) => {
          const name = f.properties.NAME || '';
          if (name) {
            l.bindTooltip(name, {
              permanent: true,
              direction: 'center',
              className: 'county-label'
            });
          }
        }
      });
      updateCountyLabels();   // run once on load
    });

  function updateCountyLabels() {
    const lyr = layerDefs.counties.layer;
    if (!lyr) return;
    const show = map.getZoom() >= 8;
    lyr.eachLayer(l => l.getTooltip() && (show ? l.openTooltip() : l.closeTooltip()));
  }
  map.on('zoomend', updateCountyLabels);

  // PLSS (paged, no popup)
  async function loadPLSS() {
    const base = 'https://gisdata.in.gov/server/rest/services/Hosted/PLSS_1/FeatureServer/2/query';
    let all = [], offset = 0, page = 1000, more = true;
    while (more) {
      const url = `${base}?where=1%3D1&outFields=*&f=geojson&resultOffset=${offset}&resultRecordCount=${page}`;
      const data = await (await fetch(url)).json();
      if (data.features && data.features.length) {
        all = all.concat(data.features);
        offset += page;
        if (data.features.length < page) more = false;
      } else more = false;
    }
    layerDefs.plss.layer = L.geoJSON({ type: 'FeatureCollection', features: all }, {
      style: { color: '#8B4513', weight: 1, fillOpacity: 0.04 },
      onEachFeature: (f, l) => {
        const p = f.properties;
        const label = (p.twp && p.rng) ? `T${p.twp}${(p.twpd||'').trim()} R${p.rng}${(p.rngd||'').trim()}` : '';
        if (label) l.bindTooltip(label, { permanent: true, direction: 'center', className: 'plss-label' });
      }
    });
    updatePLSSLabels();
  }
  loadPLSS();

  function updatePLSSLabels() {
    const lyr = layerDefs.plss.layer;
    if (!lyr) return;
    const show = map.getZoom() >= 10;
    lyr.eachLayer(l => l.getTooltip() && (show ? l.openTooltip() : l.closeTooltip()));
  }
  map.on('zoomend', updatePLSSLabels);

  let active = JSON.parse(localStorage.getItem('activeLayers') || '[]');
  function saveActive() { localStorage.setItem('activeLayers', JSON.stringify(active)); }

  function renderActive() {
    const list = document.getElementById('active-list');
    if (!list) return;
    list.innerHTML = active.map(id => {
      const def = layerDefs[id];
      if (!def) return '';
      return `
        <div class="layer-item" data-id="${id}" style="align-items:center;">
          <input type="checkbox" ${def.layer && map.hasLayer(def.layer) ? 'checked' : ''}>
          <span style="flex:1; min-width:0;">${def.name}</span>
          <input type="range" min="0" max="100" value="${Math.round(def.opacity*100)}" style="width:70px; margin:0 6px;">
          <div style="display:flex; flex-direction:column; font-size:10px; line-height:1; gap:1px;">
            <button class="up" style="padding:0 3px; border:none; background:transparent; cursor:pointer;">↑</button>
            <button class="remove" style="padding:0 3px; border:none; background:transparent; cursor:pointer;">✕</button>
            <button class="down" style="padding:0 3px; border:none; background:transparent; cursor:pointer;">↓</button>
          </div>
        </div>`;
    }).join('');

    list.querySelectorAll('.layer-item').forEach(row => {
      const id = row.dataset.id;
      const def = layerDefs[id];
      const cb = row.querySelector('input[type=checkbox]');
      const slider = row.querySelector('input[type=range]');
      const btn = row.querySelector('.remove');

      cb.addEventListener('change', () => {
        if (!def.layer) return;
        cb.checked ? def.layer.addTo(map) : map.removeLayer(def.layer);
      });
      slider.addEventListener('input', () => {
        def.opacity = slider.value / 100;
        if (!def.layer) return;

        if (def.layer.setStyle) {
          def.layer.setStyle({ fillOpacity: def.opacity * 0.08, opacity: def.opacity });
        } else if (def.layer.eachLayer) {
          def.layer.eachLayer(l => {
            if (l.setStyle) {
              l.setStyle({ opacity: def.opacity, fillOpacity: def.opacity });
            }
            if (l.setOpacity) l.setOpacity(def.opacity);
            // tooltip / label
            if (l.getTooltip && l.getTooltip()) {
              const tip = l.getTooltip();
              if (tip.getElement()) tip.getElement().style.opacity = def.opacity;
            }
          });
        }
        saveActive();
      });
      
      btn.addEventListener('click', () => {
        if (def.layer && map.hasLayer(def.layer)) map.removeLayer(def.layer);
        active = active.filter(x => x !== id);
        saveActive();
        renderActive();
      });

      // Up / Down reorder
      const up = row.querySelector('.up');
      const down = row.querySelector('.down');
      up.addEventListener('click', () => {
        const i = active.indexOf(id);
        if (i > 0) {
          [active[i-1], active[i]] = [active[i], active[i-1]];
          saveActive();
          renderActive();
        }
      });
      down.addEventListener('click', () => {
        const i = active.indexOf(id);
        if (i < active.length - 1) {
          [active[i+1], active[i]] = [active[i], active[i+1]];
          saveActive();
          renderActive();
        }
      });
    });
  }

  function addLayer(id) {
    if (!active.includes(id)) { active.push(id); saveActive(); }
    const def = layerDefs[id];
    if (def.layer && !map.hasLayer(def.layer)) def.layer.addTo(map);
    renderActive();
  }
  async function loadKMZ(file) {
    const name = file.name.replace(/\.(kmz|kml)$/i, '');
    let kmlText = '';

    if (file.name.toLowerCase().endsWith('.kmz')) {
      const zip = await JSZip.loadAsync(file);
      const kmlFile = Object.keys(zip.files).find(f => f.toLowerCase().endsWith('.kml'));
      if (!kmlFile) { alert('No KML found in KMZ'); return; }
      kmlText = await zip.files[kmlFile].async('text');
    } else {
      kmlText = await file.text();
    }

    const parser = new DOMParser();
    const xml = parser.parseFromString(kmlText, 'text/xml');
    const layer = L.layerGroup();

    // Styles (basic)
    const styles = {};
    xml.querySelectorAll('Style').forEach(s => {
      const id = s.getAttribute('id');
      if (!id) return;
      const line = s.querySelector('LineStyle');
      const icon = s.querySelector('IconStyle');
      styles[id] = {
        color: line ? '#' + (line.querySelector('color')?.textContent || 'ff0000ff').slice(2) : '#3388ff',
        weight: line ? parseFloat(line.querySelector('width')?.textContent || 2) : 2
      };
    });

    // Placemarks
    xml.querySelectorAll('Placemark').forEach(pm => {
      const styleUrl = (pm.querySelector('styleUrl')?.textContent || '').replace('#', '');
      const st = styles[styleUrl] || { color: '#3388ff', weight: 2 };
      const name = pm.querySelector('name')?.textContent || '';

      // Point — circles only, no default marker
      const pt = pm.querySelector('Point coordinates');
      if (pt) {
        const [lon, lat] = pt.textContent.trim().split(',').map(Number);
        if (isNaN(lat) || isNaN(lon)) return;

        const m = L.circleMarker([lat, lon], {
          radius: 6,
          color: '#000',
          weight: 1,
          fillColor: '#e00',
          fillOpacity: 1
        });
        const dot = L.circleMarker([lat, lon], {
          radius: 2,
          color: '#000',
          weight: 0,
          fillColor: '#000',
          fillOpacity: 1
        });
        if (name) {
          m.bindTooltip(name, {
            permanent: true,
            direction: 'top',
            offset: [0, -8],
            className: 'kmz-label'
          });
        }
        layer.addLayer(m);
        layer.addLayer(dot);
    }
      // LineString
      const ls = pm.querySelector('LineString coordinates');
      if (ls) {
        const coords = ls.textContent.trim().split(/\s+/).map(c => {
          const [lon, lat] = c.split(',').map(Number);
          return [lat, lon];
        });
        layer.addLayer(L.polyline(coords, { color: st.color, weight: st.weight }));
      }
    });

    // Register as a temporary layer
    const id = 'kmz-' + Date.now();
    layerDefs[id] = {
      name: name,
      group: 'User',
      layer: layer,
      opacity: 1,
      source: { label: 'Local KMZ: ' + file.name, url: '' }
    };
    addLayer(id);
    document.getElementById('active-layers-btn').click();
  }
  // Identify → Legend panel
let highlight = null;

function clearHighlight() {
  if (highlight) {
    map.removeLayer(highlight);
    highlight = null;
  }
}

function pointInLayer(latlng, layer) {
  if (!layer.getBounds || !layer.getBounds().contains(latlng)) return false;
  // Simple point-in-polygon using Leaflet's internal method when available
  if (layer._containsPoint) {
    const p = map.latLngToLayerPoint(latlng);
    return layer._containsPoint(p);
  }
  return true; // fallback
}

map.on('click', function (e) {
  clearHighlight();
  const hits = [];

  function checkLayer(def, layerName, attrFn) {
    if (!def.layer || !map.hasLayer(def.layer)) return;
    def.layer.eachLayer(l => {
      if (pointInLayer(e.latlng, l)) {
        hits.push({
          layerName,
          layer: l,
          attrs: attrFn(l.feature.properties),
          source: def.source || null
        });
      }
    });
  }

  // Walk Active Layers in order so the first one appears as "1 of N"
  active.forEach(id => {
    const def = layerDefs[id];
    if (!def || !def.layer || !map.hasLayer(def.layer)) return;
    if (id === 'counties') {
      checkLayer(def, 'Indiana Counties', p => ({ Name: p.NAME || '—' }));
    } else if (id === 'plss') {
      checkLayer(def, 'PLSS Townships', p => ({
        'Principal Meridian': p.meridian || '—',
        'Township': p.twp || '—',
        'Township Direction': (p.twpd || '').trim() || '—',
        'Range': p.rng || '—',
        'Range Direction': (p.rngd || '').trim() || '—'
      }));
    }
  });

  document.getElementById('legend-btn').click();
  const sb = document.getElementById('sidebar');

  if (!hits.length) {
    sb.innerHTML = `<h3>Legend</h3><p style="color:#666;">No features at this location.</p>`;
    return;
  }

  let idx = 0;
  function show(i) {
    idx = (i + hits.length) % hits.length;
    const h = hits[idx];
    clearHighlight();
    highlight = L.geoJSON(h.layer.toGeoJSON(), {
      style: { color: '#ff7800', weight: 3, fillOpacity: 0.25 }
    }).addTo(map);

    let html = `<h3>Legend</h3>`;
    html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">`;
    html += `<button id="prev-hit">‹</button>`;
    html += `<span>${idx + 1} of ${hits.length}</span>`;
    html += `<button id="next-hit">›</button>`;
    html += `<button id="clear-hit" style="margin-left:8px;">Clear</button>`;
    html += `</div>`;
    html += `<strong>${h.layerName}</strong>`;
    html += `<div style="margin-top:6px; font-size:13px;">`;
    for (let k in h.attrs) {
      html += `<div style="margin:3px 0;"><span style="color:#555;">${k}:</span> ${h.attrs[k]}</div>`;
    }
    html += `</div>`;

    // Layer-specific source
    if (h.source) {
      html += `<div style="margin-top:14px; padding-top:8px; border-top:1px solid #ccc; font-size:11px; color:#666;">`;
      html += `Source: <a href="${h.source.url}" target="_blank" style="color:#3d5c3d;">${h.source.label}</a>`;
      html += `</div>`;
    }

    sb.innerHTML = html;

    document.getElementById('prev-hit').onclick = () => show(idx - 1);
    document.getElementById('next-hit').onclick = () => show(idx + 1);
    document.getElementById('clear-hit').onclick = () => {
      clearHighlight();
      if (searchMarker) {
        map.removeLayer(searchMarker);
        searchMarker = null;
      }
      sb.innerHTML = `<h3>Legend</h3><p style="color:#666;">Click the map to identify features.</p>`;
    };
  }
  show(0);
});
  const sidebar = document.getElementById('sidebar');
  const tools = document.querySelectorAll('.tool');
  function setActiveTool(id) {
    tools.forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  document.getElementById('basemaps-btn').addEventListener('click', () => {
    setActiveTool('basemaps-btn');
    sidebar.innerHTML = `
      <h3>Basemaps</h3>
      <div class="basemap-item" data-id="streets">Streets</div>
      <div class="basemap-item" data-id="imagery">Imagery</div>
      <div class="basemap-item" data-id="hybrid">Hybrid</div>
      <div class="basemap-item" data-id="topo">Topographic</div>
      <div class="basemap-item" data-id="usgs">USGS Topo</div>
    `;
    sidebar.querySelectorAll('.basemap-item').forEach(item => {
      item.addEventListener('click', () => {
        const id = item.dataset.id;
        map.removeLayer(currentBasemap);
        if (map.hasLayer(hybridLabels)) map.removeLayer(hybridLabels);
        currentBasemap = basemaps[id];
        currentBasemap.addTo(map);
        if (id === 'hybrid') hybridLabels.addTo(map);
        localStorage.setItem('basemap', id);
        sidebar.querySelectorAll('.basemap-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
      });
    });
  });
// Button Handlers
  document.getElementById('add-content-btn').addEventListener('click', () => {
    setActiveTool('add-content-btn');
    sidebar.innerHTML = `
      <h3>Add Content</h3>
      <div style="font-weight:bold; margin:8px 0 4px;">Boundaries</div>
      <div class="basemap-item" data-add="counties">Indiana Counties</div>
      <div class="basemap-item" data-add="plss">PLSS Townships</div>
      <div style="font-weight:bold; margin:12px 0 4px; color:#666;">Geology</div>
      <div style="color:#999; font-size:12px; margin-left:8px;">(coming soon)</div>
      <div style="font-weight:bold; margin:12px 0 4px; color:#666;">Hydrology</div>
      <div style="color:#999; font-size:12px; margin-left:8px;">(coming soon)</div>
        <div style="margin-top:16px; padding-top:10px; border-top:1px solid #ccc;">
        <button id="add-kmz-btn" style="width:100%; padding:6px;">Add .kmz</button>
        <input type="file" id="kmz-file" accept=".kmz,.kml" style="display:none;">
              <div style="font-weight:bold; margin:12px 0 4px;">Elevation</div>
      <div class="basemap-item" data-add="hillshade">Hillshade</div>
      </div>
    `;
    sidebar.querySelectorAll('[data-add]').forEach(item => {
      item.addEventListener('click', () => addLayer(item.dataset.add));
    });
        document.getElementById('add-kmz-btn').onclick = () => {
      document.getElementById('kmz-file').click();
    };
    document.getElementById('kmz-file').onchange = (e) => {
      if (e.target.files[0]) loadKMZ(e.target.files[0]);
    };
  });

  document.getElementById('active-layers-btn').addEventListener('click', () => {
    setActiveTool('active-layers-btn');
    sidebar.innerHTML = `<h3>Active Layers</h3><div id="active-list"></div>`;
    renderActive();
  });

  document.getElementById('legend-btn').addEventListener('click', () => {
    setActiveTool('legend-btn');
    sidebar.innerHTML = `<h3>Legend</h3><p style="color:#666;">Click the map to identify features.</p>`;
  });
    document.getElementById('reset-btn').addEventListener('click', () => {
    // Clear active layers
    active.forEach(id => {
      const def = layerDefs[id];
      if (def && def.layer && map.hasLayer(def.layer)) {
        map.removeLayer(def.layer);
      }
    });
    active = [];
    saveActive();

    // Clear highlight and search pin
    clearHighlight();
    if (searchMarker) {
      map.removeLayer(searchMarker);
      searchMarker = null;
    }

    // Reset basemap to Streets
    if (currentBasemap && map.hasLayer(currentBasemap)) {
      map.removeLayer(currentBasemap);
    }
    if (map.hasLayer(hybridLabels)) {
      map.removeLayer(hybridLabels);
    }
    currentBasemap = basemaps.streets;
    currentBasemap.addTo(map);
    localStorage.setItem('basemap', 'streets');

    // Reset view
    map.setView([39.8, -86.2], 7);

    // Refresh Active Layers panel if it's open
    if (document.getElementById('active-list')) {
      renderActive();
    }

    // Reset Legend panel
    const sb = document.getElementById('sidebar');
    if (sb && sb.querySelector('h3') && sb.querySelector('h3').textContent === 'Legend') {
      sb.innerHTML = `<h3>Legend</h3><p style="color:#666;">Click the map to identify features.</p>`;
    }
  });
  // Search
  let searchMarker = null;
  document.getElementById('search-btn').addEventListener('click', doSearch);
  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });

  function doSearch() {
    const type = document.getElementById('search-type').value;
    const q = document.getElementById('search-input').value.trim();
    if (!q) return;

    if (type === 'latlon') {
      const parts = q.split(/[,\s]+/).map(Number);
      if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        // Accept either "lat, lon" or "lon, lat" — try both if needed
        const lat = parts[0];
        const lon = parts[1];
        dropMarker(lat, lon, q);
      } else {
        alert('Enter as latitude, longitude (e.g. 39.77, -86.16)');
      }
    } else {
      // Address via Nominatim
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q + ', Indiana')}&format=json&limit=1`;
      fetch(url, { headers: { 'Accept': 'application/json' } })
        .then(r => r.json())
        .then(data => {
          if (data && data[0]) {
            dropMarker(parseFloat(data[0].lat), parseFloat(data[0].lon), data[0].display_name);
          } else {
            alert('Address not found');
          }
        })
        .catch(() => alert('Search failed'));
    }
  }

function dropMarker(lat, lon, label) {
    if (searchMarker) map.removeLayer(searchMarker);

    const pinIcon = L.divIcon({
      className: 'old-marker',
      html: `
        <div style="position:relative; width:20px; height:28px;">
          <div style="
            width:16px; height:16px;
            background:#ffcc00;
            border:2px solid #333;
            border-radius:50%;
            position:absolute; top:0; left:2px;
            box-shadow:1px 1px 2px rgba(0,0,0,0.4);
          "></div>
          <div style="
            width:2px; height:20px;
            background:#333;
            position:absolute; top:14px; left:9px;
          "></div>
        </div>`,
      iconSize: [20, 28],
      iconAnchor: [10, 28]
    });
    searchMarker = L.marker([lat, lon], { icon: pinIcon }).addTo(map);
    searchMarker.bindPopup(label).openPopup();
    map.setView([lat, lon], 14);
  }
  document.getElementById('active-layers-btn').click();
</script>
</body>
</html>
