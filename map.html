<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Old Indiana Map</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Tahoma, Geneva, sans-serif;
      background: #d4d0c8;
      color: #000;
      font-size: 14px;
    }
    .banner {
      background: #3d5c3d url('banner1.png') center / cover no-repeat;
      padding: 6px 12px;
      border-bottom: 2px solid #2a402a;
      min-height: 52px;
      display: flex;
      align-items: center;
    }
    .banner img {
      height: 40px;
      width: auto;
    }
    .tabs {
      background: #d4d0c8;
      border-bottom: 1px solid #808080;
      padding: 2px 6px 0 6px;
      display: flex;
      gap: 2px;
    }
    .tab {
      background: #d4d0c8;
      border: 1px solid #808080;
      border-bottom: none;
      padding: 6px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    .tab.active {
      background: #fff;
      font-weight: bold;
      position: relative;
      top: 1px;
      border-bottom: 1px solid #fff;
    }
    .toolbar {
      background: #ece9d8;
      border-bottom: 1px solid #808080;
      padding: 6px 8px;
      display: flex;
      gap: 6px;
      font-size: 13px;
    }
    .tool {
      background: #f5f4ea;
      border: 1px solid #808080;
      padding: 4px 10px;
      cursor: pointer;
    }
    .tool:hover { background: #fff; }
    .main {
      display: flex;
      height: calc(100vh - 110px);
    }
    .sidebar {
      width: 240px;
      background: #f0f0f0;
      border-right: 1px solid #808080;
      padding: 10px 12px;
      font-size: 14px;
      overflow-y: auto;
    }
    .sidebar h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      font-weight: bold;
    }
    #map { flex: 1; }
    .layer-item {
      margin: 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="banner">
    <img src="logo.png" alt="IndianaMAP">
  </div>
  <div class="tabs">
    <div class="tab active">Map Viewer</div>
    <div class="tab">Map Gallery</div>
    <div class="tab">Layer Gallery</div>
  </div>
  <div class="toolbar">
    <div class="tool">Layers</div>
    <div class="tool">Identify</div>
    <div class="tool">Measure</div>
    <div class="tool">Print</div>
  </div>
  <div class="main">
    <div class="sidebar">
      <h3>Active Layers</h3>
      <div id="layer-list">
        <div class="layer-item">
          <input type="checkbox" id="counties" checked>
          <label for="counties">Indiana Counties</label>
        </div>
      </div>
    </div>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([39.8, -86.2], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 18
    }).addTo(map);

    let countiesLayer;
    const checkbox = document.getElementById('counties');
    const savedState = localStorage.getItem('countiesVisible');
    if (savedState !== null) checkbox.checked = savedState === 'true';

    fetch('https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json')
      .then(r => r.json())
      .then(data => {
        const indiana = {
          type: 'FeatureCollection',
          features: data.features.filter(f => 
            f.properties.STATE === '18' || (f.id && f.id.toString().startsWith('18'))
          )
        };
        countiesLayer = L.geoJSON(indiana, {
          style: { color: '#3d5c3d', weight: 1.5, fillOpacity: 0.08 },
          onEachFeature: (f, l) => l.bindPopup(f.properties.NAME || 'County')
        });
        if (checkbox.checked) countiesLayer.addTo(map);
        checkbox.addEventListener('change', function () {
          localStorage.setItem('countiesVisible', this.checked);
          this.checked ? countiesLayer.addTo(map) : map.removeLayer(countiesLayer);
        });
      });
  </script>
</body>
</html>
