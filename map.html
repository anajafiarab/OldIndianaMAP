<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Old Indiana Map</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Tahoma, Geneva, sans-serif;
      background: #d4d0c8;
    }
    .topbar {
      background: #4a6b4a;
      color: white;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: bold;
    }
    .tabs {
      background: #d4d0c8;
      border-bottom: 1px solid #808080;
      padding: 2px 6px 0 6px;
      display: flex;
      gap: 2px;
    }
    .tab {
      background: #d4d0c8;
      border: 1px solid #808080;
      border-bottom: none;
      padding: 3px 14px;
      font-size: 12px;
      cursor: pointer;
    }
    .tab.active {
      background: #fff;
      font-weight: bold;
      position: relative;
      top: 1px;
    }
    .toolbar {
      background: #d4d0c8;
      border-bottom: 1px solid #808080;
      padding: 4px 8px;
      display: flex;
      gap: 6px;
      font-size: 11px;
    }
    .tool {
      background: #ece9d8;
      border: 1px solid #808080;
      padding: 2px 8px;
      cursor: pointer;
    }
    .main {
      display: flex;
      height: calc(100vh - 72px);
    }
    .sidebar {
      width: 220px;
      background: #f0f0f0;
      border-right: 1px solid #808080;
      padding: 8px;
      font-size: 12px;
      overflow-y: auto;
    }
    .sidebar strong { display: block; margin-bottom: 8px; }
    #map {
      flex: 1;
      background: #ddd;
    }
    .layer-item {
      margin: 4px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .scale-note {
      position: absolute;
      bottom: 8px;
      left: 230px;
      background: rgba(255,255,255,0.85);
      border: 1px solid #999;
      padding: 2px 6px;
      font-size: 11px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div class="topbar">Old Indiana Map</div>
  <div class="tabs">
    <div class="tab active">Map Viewer</div>
    <div class="tab">Map Gallery</div>
    <div class="tab">Layer Gallery</div>
  </div>
  <div class="toolbar">
    <div class="tool">Layers</div>
    <div class="tool">Identify</div>
    <div class="tool">Measure</div>
    <div class="tool">Print</div>
  </div>
  <div class="main">
    <div class="sidebar">
      <strong>Active Layers</strong>
      <div id="layer-list">
        <div class="layer-item">
          <input type="checkbox" id="counties" checked>
          <label for="counties">Indiana Counties</label>
        </div>
      </div>
    </div>
    <div id="map"></div>
  </div>
  <div class="scale-note">Scale bar appears here</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Initialize map centered on Indiana
  const map = L.map('map').setView([39.8, -86.2], 7);

  // OpenStreetMap basemap
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(map);

  // Indiana counties layer
  let countiesLayer;

  fetch('https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json')
    .then(response => response.json())
    .then(data => {
      // Filter to Indiana only (FIPS starts with 18)
      const indiana = {
        type: 'FeatureCollection',
        features: data.features.filter(f => f.properties.STATE === '18' || (f.id && f.id.toString().startsWith('18')))
      };

      countiesLayer = L.geoJSON(indiana, {
        style: {
          color: '#4a6b4a',
          weight: 1,
          fillOpacity: 0.1
        },
        onEachFeature: function (feature, layer) {
          layer.bindPopup(feature.properties.NAME || 'County');
        }
      });

      // Add it by default
      countiesLayer.addTo(map);

      // Wire up the checkbox
      const checkbox = document.getElementById('counties');
      checkbox.addEventListener('change', function () {
        if (this.checked) {
          countiesLayer.addTo(map);
        } else {
          map.removeLayer(countiesLayer);
        }
      });
    })
    .catch(err => console.error('Failed to load counties:', err));
</script>
</body>
</html>
