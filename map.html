<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Old Indiana Map</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Tahoma, Geneva, sans-serif;
      background: #d4d0c8;
      color: #000;
      font-size: 14px;
    }
    .banner {
      background: #3d5c3d url('banner1.png') center / cover no-repeat;
      padding: 6px 12px;
      border-bottom: 2px solid #2a402a;
      min-height: 52px;
      display: flex;
      align-items: center;
    }
    .banner img { height: 40px; width: auto; }
    .tabs {
      background: #d4d0c8;
      border-bottom: 1px solid #808080;
      padding: 2px 6px 0 6px;
      display: flex;
      gap: 2px;
    }
    .tab {
      background: #d4d0c8;
      border: 1px solid #808080;
      border-bottom: none;
      padding: 6px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    .tab.active {
      background: #fff;
      font-weight: bold;
      position: relative;
      top: 1px;
      border-bottom: 1px solid #fff;
    }
    .toolbar {
      background: #ece9d8;
      border-bottom: 1px solid #808080;
      padding: 6px 8px;
      display: flex;
      gap: 6px;
      font-size: 13px;
    }
    .tool {
      background: #f5f4ea;
      border: 1px solid #808080;
      padding: 4px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
    }
    .tool img { height: 16px; width: auto; margin-right: 5px; }
    .tool:hover, .tool.active { background: #fff; }
    .main { display: flex; height: calc(100vh - 130px); }
    .sidebar {
      width: 240px;
      background: #f0f0f0;
      border-right: 1px solid #808080;
      padding: 10px 12px;
      font-size: 14px;
      overflow-y: auto;
    }
    .sidebar h3 { margin: 0 0 10px 0; font-size: 15px; font-weight: bold; }
    #map { flex: 1; }
    .layer-item, .basemap-item {
      margin: 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .basemap-item:hover { background: #e0e0e0; }
    .basemap-item.active { font-weight: bold; }
    .plss-label {
  background: transparent;
  border: none;
  box-shadow: none;
  font-size: 11px;
  font-weight: bold;
  color: #5a3a1a;
  text-shadow: 1px 1px 1px #fff;
}

  </style>
</head>
<body>
  <div class="banner">
    <img src="logo.png" alt="IndianaMAP">
  </div>
  <div class="tabs">
    <div class="tab active">Map Viewer</div>
    <div class="tab">Map Gallery</div>
    <div class="tab">Layer Gallery</div>
  </div>
  <div class="toolbar">
    <div class="tool" id="basemaps-btn">
      <img src="basemaps.icon.png" alt="Basemaps">
      Basemaps
    </div>
    <div class="tool" id="add-content-btn">
      <img src="addContent.png" alt="Add Content">
      Add Content
    </div>
    <div class="tool" id="active-layers-btn">
      <img src="activeLayers.png" alt="Active Layers">
      Active Layers
    </div>
    <div class="tool" id="legend-btn">
      <img src="legend.png" alt="Legend">
      Legend
    </div>
    <div class="tool" id="reset-btn">
      <img src="reset.png" alt="Reset">
      Reset
    </div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar">
      <h3>Active Layers</h3>
      <div id="layer-list">
        <div class="layer-item">
          <input type="checkbox" id="counties" checked>
          <label for="counties">Indiana Counties</label>
        </div>
      </div>
    </div>
    <div id="map"></div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const wideBounds = L.latLngBounds(
    [25, -100],
    [50, -70]
  );

  const map = L.map('map', {
    maxBounds: wideBounds,
    maxBoundsViscosity: 0.3,
    minZoom: 5
  }).setView([39.8, -86.2], 7);

  const basemaps = {
    streets: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
    }),
    imagery: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri', maxZoom: 19
    }),
    hybrid: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri', maxZoom: 19
    }),
    topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap', maxZoom: 17
    })
  };

  const hybridLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri', maxZoom: 19
  });

  const savedBasemap = localStorage.getItem('basemap') || 'streets';
  let currentBasemap = basemaps[savedBasemap] || basemaps.streets;
  currentBasemap.addTo(map);
  if (savedBasemap === 'hybrid') hybridLabels.addTo(map);

  // Counties
  let countiesLayer;
  const checkbox = document.getElementById('counties');
  const savedCounties = localStorage.getItem('countiesVisible');
  if (savedCounties !== null) checkbox.checked = savedCounties === 'true';

  fetch('https://raw.githubusercontent.com/plotly/datasets/master/geojson-counties-fips.json')
    .then(r => r.json())
    .then(data => {
      const indiana = {
        type: 'FeatureCollection',
        features: data.features.filter(f => 
          f.properties.STATE === '18' || (f.id && f.id.toString().startsWith('18'))
        )
      };
      countiesLayer = L.geoJSON(indiana, {
        style: { color: '#3d5c3d', weight: 1.5, fillOpacity: 0.08 },
        onEachFeature: (f, l) => l.bindPopup(f.properties.NAME || 'County')
      });
      if (checkbox.checked) countiesLayer.addTo(map);
    });

  // PLSS Townships
  let plssLayer = null;
  fetch('https://gisdata.in.gov/server/rest/services/Hosted/PLSS_1/FeatureServer/2/query?where=1%3D1&outFields=*&f=geojson')
    .then(r => r.json())
    .then(data => {
      plssLayer = L.geoJSON(data, {
        style: { color: '#8B4513', weight: 1, fillOpacity: 0.04 },
        onEachFeature: (f, l) => {
          const p = f.properties;
          const twp = p.twp || '';
          const twpd = (p.twpd || '').trim();
          const rng = p.rng || '';
          const rngd = (p.rngd || '').trim();
          const label = (twp && rng) ? `T${twp}${twpd} R${rng}${rngd}` : '';
          if (label) {
            l.bindTooltip(label, {
              permanent: true,
              direction: 'center',
              className: 'plss-label'
            });
          }
          l.bindPopup(label || 'Township');
        }
      });
      updatePLSSLabels();
    })
    .catch(err => console.error('PLSS failed to load', err));

  function updatePLSSLabels() {
    if (!plssLayer) return;
    const show = map.getZoom() >= 8;
    plssLayer.eachLayer(l => {
      if (l.getTooltip()) {
        show ? l.openTooltip() : l.closeTooltip();
      }
    });
  }
  map.on('zoomend', updatePLSSLabels);

  // Sidebar
  const sidebar = document.getElementById('sidebar');
  const tools = document.querySelectorAll('.tool');

  function setActiveTool(id) {
    tools.forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  document.getElementById('basemaps-btn').addEventListener('click', () => {
    setActiveTool('basemaps-btn');
    sidebar.innerHTML = `
      <h3>Basemaps</h3>
      <div class="basemap-item" data-id="streets">Streets</div>
      <div class="basemap-item" data-id="imagery">Imagery</div>
      <div class="basemap-item" data-id="hybrid">Hybrid</div>
      <div class="basemap-item" data-id="topo">Topographic</div>
      <div class="basemap-item" data-id="plss">PLSS Townships</div>
    `;
    document.querySelectorAll('.basemap-item').forEach(item => {
      item.addEventListener('click', () => {
        const id = item.dataset.id;
        if (id === 'plss') {
          if (plssLayer) {
            if (map.hasLayer(plssLayer)) map.removeLayer(plssLayer);
            else plssLayer.addTo(map);
          }
          return;
        }
        map.removeLayer(currentBasemap);
        if (map.hasLayer(hybridLabels)) map.removeLayer(hybridLabels);
        currentBasemap = basemaps[id];
        currentBasemap.addTo(map);
        if (id === 'hybrid') hybridLabels.addTo(map);
        localStorage.setItem('basemap', id);
        document.querySelectorAll('.basemap-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
      });
    });
  });

  document.getElementById('active-layers-btn').addEventListener('click', () => {
    setActiveTool('active-layers-btn');
    sidebar.innerHTML = `
      <h3>Active Layers</h3>
      <div class="layer-item">
        <input type="checkbox" id="counties" ${checkbox.checked ? 'checked' : ''}>
        <label for="counties">Indiana Counties</label>
      </div>
    `;
    document.getElementById('counties').addEventListener('change', function () {
      localStorage.setItem('countiesVisible', this.checked);
      if (!countiesLayer) return;
      this.checked ? countiesLayer.addTo(map) : map.removeLayer(countiesLayer);
    });
  });

  document.getElementById('active-layers-btn').click();
</script>
</body>
</html>
